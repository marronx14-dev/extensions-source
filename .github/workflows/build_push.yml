name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ManhwaShot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK and Inspect Repo
        run: |
          ./gradlew :src:es:manhwashot:assembleRelease -x spotlessCheck -x spotlessKotlinCheck
          ./gradlew :inspector:run --args="repo" || true

      - name: Prepare Repo Branch
        run: |
          mkdir -p deploy/apk

          # Copiar el APK compilado
          APK_PATH=$(find src/es/manhwashot/build -name "*.apk" | head -n 1)
          cp "$APK_PATH" deploy/apk/manhwashot-release.apk

          # Si el inspector generó el repo, moverlo a deploy
          if [ -d "repo" ]; then
            cp -r repo/* deploy/
          fi

          # Garantizar que repo.json exista en la raíz
          cat << 'EOF' > deploy/repo.json
          {
            "meta": {
              "name": "ManhwaShot",
              "description": "Extension ManhwaShot",
              "website": "https://marronx14-dev.github.io/extensions-source"
            }
          }
          EOF

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
