name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ManhwaShot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ManhwaShot APK
        run: ./gradlew :src:es:manhwashot:assembleRelease -x spotlessCheck -x spotlessKotlinCheck

      - name: Prepare Repo Branch
        run: |
          mkdir -p deploy/apk
          mkdir -p deploy/repo/apk
          
          find src/es/manhwashot/build -name "*.apk" -exec cp {} deploy/apk/manhwashot-release.apk \;
          cp deploy/apk/manhwashot-release.apk deploy/repo/apk/manhwashot-release.apk

          # Extraer la huella SHA-256 real de la firma del APK
          FINGERPRINT=$(keytool -printcert -jarfile deploy/apk/manhwashot-release.apk | grep "SHA256:" | head -n 1 | tr -d '[:space:]' | cut -d: -f2- | tr '[:upper:]' '[:lower:]')
          if [ -z "$FINGERPRINT" ]; then
            FINGERPRINT="default"
          fi
          echo "Fingerprint detectado: $FINGERPRINT"

          cat << 'EOF' > deploy/repo.json
          {
            "meta": {
              "name": "ManhwaShot",
              "description": "Repositorio de la extension ManhwaShot",
              "website": "https://marronx14-dev.github.io/extensions-source"
            },
            "name": "ManhwaShot",
            "website": "https://marronx14-dev.github.io/extensions-source"
          }
          EOF
          cp deploy/repo.json deploy/repo/repo.json

          cat << EOF > deploy/index.min.json
          [
            {
              "name": "ManhwaShot",
              "pkg": "eu.kanade.tachiyomi.extension.es.manhwashot",
              "apk": "manhwashot-release.apk",
              "lang": "es",
              "code": 1,
              "version": "1.4.1",
              "nsfw": 1,
              "hasReadme": 0,
              "hasChangelog": 0,
              "signingKeyFingerprint": "$FINGERPRINT",
              "sources": [
                {
                  "name": "ManhwaShot",
                  "id": 8512398471209384712,
                  "baseUrl": "https://manhwashot.lat",
                  "lang": "es"
                }
              ]
            }
          ]
          EOF
          cp deploy/index.min.json deploy/index.json
          cp deploy/index.min.json deploy/repo/index.min.json
          cp deploy/index.min.json deploy/repo/index.json

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
