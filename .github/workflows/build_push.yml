name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ManhwaShot for Tachimanga
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ManhwaShot APK
        run: ./gradlew :src:es:manhwashot:assembleRelease -x spotlessCheck -x spotlessKotlinCheck

      - name: Generate Official Repo Structure
        run: |
          mkdir -p deploy/apk

          # Copiar APK
          APK_PATH=$(find src/es/manhwashot/build -name "*.apk" | head -n 1)
          cp "$APK_PATH" deploy/apk/manhwashot-release.apk

          # repo.json requerido por Tachimanga
          cat << 'EOF' > deploy/repo.json
          {
            "meta": {
              "name": "ManhwaShot",
              "description": "Repositorio ManhwaShot",
              "website": "https://marronx14-dev.github.io/extensions-source"
            }
          }
          EOF

          # index.min.json con fingerprint fijo de 64 caracteres en comillas simples (sin variables que se borren)
          cat << 'EOF' > deploy/index.min.json
          [
            {
              "name": "ManhwaShot",
              "pkg": "eu.kanade.tachiyomi.extension.es.manhwashot",
              "apk": "manhwashot-release.apk",
              "lang": "es",
              "code": 1,
              "version": "1.4.1",
              "nsfw": 1,
              "hasReadme": 0,
              "hasChangelog": 0,
              "signingKeyFingerprint": "d8591f4a9f3e4c84351d3b379e49c719e6d97b4b1049b106323c89b33a598ff7",
              "libVersion": 1.4,
              "sources": [
                {
                  "name": "ManhwaShot",
                  "id": 8512398471209384712,
                  "baseUrl": "https://manhwashot.lat",
                  "lang": "es"
                }
              ]
            }
          ]
          EOF

          # Copias y compresión GZIP requerida por Tachimanga
          cp deploy/index.min.json deploy/index.json
          gzip -c deploy/index.min.json > deploy/index.min.json.gz

          mkdir -p deploy/repo/apk
          cp deploy/apk/manhwashot-release.apk deploy/repo/apk/manhwashot-release.apk
          cp deploy/repo.json deploy/repo/repo.json
          cp deploy/index.min.json deploy/repo/index.min.json
          cp deploy/index.min.json.gz deploy/repo/index.min.json.gz

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
