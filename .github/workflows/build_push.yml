name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

jobs:
  build:
    name: Build ManhwaShot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ManhwaShot APK
        run: ./gradlew :src:es:manhwashot:assembleRelease

      - name: Prepare Repo Branch
        run: |
          mkdir -p deploy/apk
          cp src/es/manhwashot/build/outputs/apk/release/*.apk deploy/apk/manhwashot-release.apk
          cat << 'EOF' > deploy/index.min.json
          [
            {
              "name": "ManhwaShot",
              "pkg": "eu.kanade.tachiyomi.extension.es.manhwashot",
              "apk": "manhwashot-release.apk",
              "lang": "es",
              "code": 1,
              "version": "1.0.0",
              "nsfw": 1,
              "hasReadme": 0,
              "hasChangelog": 0
            }
          ]
          EOF
          cp deploy/index.min.json deploy/index.json

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
