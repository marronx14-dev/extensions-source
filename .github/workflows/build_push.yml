name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ManhwaShot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Repo via Gradle
        run: |
          ./gradlew :src:es:manhwashot:assembleRelease -x spotlessCheck -x spotlessKotlinCheck
          ./gradlew createRepo -x spotlessCheck -x spotlessKotlinCheck

      - name: Prepare Repo Branch
        run: |
          mkdir -p deploy
          
          # Copiar la salida generada por la tarea oficial createRepo de Keiyoushi
          if [ -d "repo" ]; then
            cp -r repo/* deploy/
          fi

          # Asegurar que el APK y los índices estén en la raíz de deploy
          find build -name "*.apk" -o -name "*.json" 2>/dev/null || true

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
