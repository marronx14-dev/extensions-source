name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ManhwaShot for Tachimanga
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ManhwaShot APK
        run: ./gradlew :src:es:manhwashot:assembleRelease -x spotlessCheck -x spotlessKotlinCheck

      - name: Generate Tachimanga Compatible Repo
        run: |
          mkdir -p deploy/apk
          
          # Ubicar el APK compilado
          APK_PATH=$(find src/es/manhwashot/build -name "*.apk" | head -n 1)
          cp "$APK_PATH" deploy/apk/manhwashot-release.apk

          # Obtener huella SHA256
          FP=$(keytool -printcert -jarfile deploy/apk/manhwashot-release.apk 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "\(FP" ] || [\){#FP} -ne 64 ]; then
            FP=$(sha256sum deploy/apk/manhwashot-release.apk | awk '{print $1}')
          fi
          echo "Fingerprint SHA-256: $FP"

          # repo.json requerido
          cat << 'EOF' > deploy/repo.json
          {
            "meta": {
              "name": "ManhwaShot",
              "description": "Repositorio ManhwaShot para Tachimanga",
              "website": "https://marronx14-dev.github.io/extensions-source"
            }
          }
          EOF

          # index.min.json con modelo estricto para lectores basados en iOS/Mihon
          cat << EOF > deploy/index.min.json
          [
            {
              "name": "ManhwaShot",
              "pkg": "eu.kanade.tachiyomi.extension.es.manhwashot",
              "apk": "apk/manhwashot-release.apk",
              "lang": "es",
              "code": 1,
              "version": "1.4.1",
              "nsfw": 1,
              "hasReadme": 0,
              "hasChangelog": 0,
              "signingKeyFingerprint": "$FP",
              "libVersion": 1.4,
              "sources": [
                {
                  "name": "ManhwaShot",
                  "id": 8512398471209384712,
                  "baseUrl": "https://manhwashot.lat",
                  "lang": "es"
                }
              ]
            }
          ]
          EOF

          # Generar copias de respaldo
          cp deploy/index.min.json deploy/index.json
          
          # Generar versión comprimida GZIP (prioritaria en Tachimanga para index.min.json)
          gzip -c deploy/index.min.json > deploy/index.min.json.gz
          gzip -c deploy/index.json > deploy/index.json.gz

          # Crear espejo en raíz y subcarpeta
          mkdir -p deploy/repo/apk
          cp deploy/apk/manhwashot-release.apk deploy/repo/apk/manhwashot-release.apk
          cp deploy/repo.json deploy/repo/repo.json
          cp deploy/index.min.json deploy/repo/index.min.json
          cp deploy/index.min.json.gz deploy/repo/index.min.json.gz

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
