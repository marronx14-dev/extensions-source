name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ManhwaShot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ManhwaShot APK
        run: ./gradlew :src:es:manhwashot:assembleRelease -x spotlessCheck -x spotlessKotlinCheck

      - name: Prepare Repo and Build Valid Mihon Index
        run: |
          mkdir -p deploy/apk

          # 1. Copiar APK
          APK_FILE=$(find src/es/manhwashot/build -name "*.apk" | head -n 1)
          cp "$APK_FILE" deploy/apk/manhwashot-release.apk

          # 2. Extraer SHA256 real (64 caracteres limpios en minúsculas)
          FP=$(keytool -printcert -jarfile deploy/apk/manhwashot-release.apk | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ ${#FP} -ne 64 ]; then
            FP=$(sha256sum deploy/apk/manhwashot-release.apk | cut -d ' ' -f 1)
          fi
          echo "SHA256 Fingerprint final: $FP"

          # 3. repo.json oficial
          cat << 'EOF' > deploy/repo.json
          {
            "meta": {
              "name": "ManhwaShot Repo",
              "description": "Repositorio ManhwaShot",
              "website": "https://marronx14-dev.github.io/extensions-source"
            }
          }
          EOF

          # 4. index.min.json con el esquema estricto de Mihon
          cat << EOF > deploy/index.min.json
          [
            {
              "name": "ManhwaShot",
              "pkg": "eu.kanade.tachiyomi.extension.es.manhwashot",
              "apk": "manhwashot-release.apk",
              "lang": "es",
              "code": 1,
              "version": "1.4.1",
              "nsfw": 1,
              "hasReadme": 0,
              "hasChangelog": 0,
              "signingKeyFingerprint": "$FP",
              "libVersion": 1.4,
              "sources": [
                {
                  "name": "ManhwaShot",
                  "id": 8512398471209384712,
                  "baseUrl": "https://manhwashot.lat",
                  "lang": "es"
                }
              ]
            }
          ]
          EOF

          # Copias adicionales que Mihon consulta por compatibilidad
          cp deploy/index.min.json deploy/index.json
          gzip -kf deploy/index.min.json
          gzip -kf deploy/index.json

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
