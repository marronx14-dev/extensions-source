name: Build and Push Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/es/manhwashot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ManhwaShot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ManhwaShot APK
        run: ./gradlew :src:es:manhwashot:assembleRelease -x spotlessCheck -x spotlessKotlinCheck

      - name: Prepare Repo Branch
        run: |
          mkdir -p deploy/apk
          mkdir -p deploy/repo/apk

          # Copiar el APK compilado
          APK_PATH=$(find src/es/manhwashot/build -name "*.apk" | head -n 1)
          cp "$APK_PATH" deploy/apk/manhwashot-release.apk
          cp "$APK_PATH" deploy/repo/apk/manhwashot-release.apk

          # Extraer el hash SHA-256 limpio de 64 caracteres
          RAW_FP=$(keytool -printcert -jarfile deploy/apk/manhwashot-release.apk | grep -i "SHA256:" | head -n 1 | cut -d: -f2- | tr -d '[:space:]' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$RAW_FP" ]; then
            RAW_FP=$(sha256sum deploy/apk/manhwashot-release.apk | cut -d ' ' -f 1)
          fi
          echo "Fingerprint extraído: $RAW_FP"

          cat << 'EOF' > deploy/repo.json
          {
            "meta": {
              "name": "ManhwaShot",
              "description": "Repositorio ManhwaShot",
              "website": "https://marronx14-dev.github.io/extensions-source"
            }
          }
          EOF
          cp deploy/repo.json deploy/repo/repo.json

          cat << EOF > deploy/index.min.json
          [
            {
              "name": "ManhwaShot",
              "pkg": "eu.kanade.tachiyomi.extension.es.manhwashot",
              "apk": "manhwashot-release.apk",
              "lang": "es",
              "code": 1,
              "version": "1.4.1",
              "nsfw": 1,
              "hasReadme": 0,
              "hasChangelog": 0,
              "signingKeyFingerprint": "$RAW_FP",
              "libVersion": 1.4,
              "sources": [
                {
                  "name": "ManhwaShot",
                  "id": 8512398471209384712,
                  "baseUrl": "https://manhwashot.lat",
                  "lang": "es",
                  "signingKeyFingerprint": "$RAW_FP"
                }
              ]
            }
          ]
          EOF

          cp deploy/index.min.json deploy/index.json
          cp deploy/index.min.json deploy/repo/index.min.json
          cp deploy/index.min.json deploy/repo/index.json

      - name: Deploy to GitHub Pages (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
